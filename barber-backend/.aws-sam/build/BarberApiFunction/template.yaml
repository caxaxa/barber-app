AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Barber Appointment Scheduling Backend

Parameters:
  AppointmentsTableName:
    Type: String
    Description: "Name of the pre-existing DynamoDB table for appointments"
    Default: "Appointments"

  BarbersTableName:
    Type: String
    Description: "Name of the pre-existing DynamoDB table for barbers"
    Default: "Barbers"

Globals:
  Api:
    Cors:
      AllowOrigin: "'*'"
      AllowMethods: "'OPTIONS,GET,POST'"
      AllowHeaders: "'Content-Type'"

Resources:
  BarberApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: app.lambda_handler
      Runtime: python3.8
      Environment:
        Variables:
          APPOINTMENTS_TABLE: !Ref AppointmentsTableName
          BARBERS_TABLE: !Ref BarbersTableName  # <-- new environment variable
      Policies:
        - AmazonDynamoDBFullAccess
      Events:
        GetBarbers:
          Type: Api
          Properties:
            Path: /barbers
            Method: GET
        GetAppointments:
          Type: Api
          Properties:
            Path: /appointments
            Method: GET
        GetAllAppointments:
          Type: Api
          Properties:
            Path: /appointments/all
            Method: GET
        BookAppointment:
          Type: Api
          Properties:
            Path: /appointments/book
            Method: POST
