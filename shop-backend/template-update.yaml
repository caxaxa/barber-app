  EvolutionApiQrFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: evolution-api/
      Handler: generate-qr.handler
      Runtime: nodejs18.x
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          EVO_BASE_URL: !Ref EvoBaseUrl
          EVO_API_KEY: !Ref EvoApiKey
          API_URL: !Sub "https://${AppPublicApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
      Events:
        GenerateQrCode:
          Type: Api
          Properties:
            RestApiId: !Ref AppPublicApi
            Path: /whatsapp/generate-qr
            Method: post
            Auth:
              ApiKeyRequired: true